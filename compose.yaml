services:
  reports:
    image: wukong-reports:local
    build:
      context: .
      target: reports
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - type: bind
        source: ./results
        target: /data
        read_only: true
