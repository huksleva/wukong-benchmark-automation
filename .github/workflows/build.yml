name: Build and checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows application
        run: dotnet build src/Wukong.Automation/Wukong.Automation.csproj -c Release
      - name: Run automated checks
        run: dotnet run --project tests/Wukong.Tests -c Release
      - name: Publish Windows x64 application with .NET included
        run: dotnet publish src/Wukong.Automation/Wukong.Automation.csproj -c Release -r win-x64 --self-contained true -o artifacts/runner
      - name: Include launch instructions and build identity
        shell: pwsh
        run: |
          Copy-Item packaging/QUICKSTART.txt artifacts/runner/QUICKSTART.txt
          @{ commit = $env:GITHUB_SHA; platform = 'win-x64'; runtimeIncluded = $true } | ConvertTo-Json | Set-Content artifacts/runner/build-info.json
      - name: Upload runnable Windows folder
        uses: actions/upload-artifact@v4
        with:
          name: wukong-runner-windows
          path: artifacts/runner/
          if-no-files-found: error
          retention-days: 14
