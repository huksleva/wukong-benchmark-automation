name: Build and checks
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Wukong.Automation/Wukong.Automation.csproj -c Release
      - run: dotnet run --project tests/Wukong.Tests -c Release
      - run: dotnet publish src/Wukong.Automation/Wukong.Automation.csproj -c Release --self-contained false -o artifacts/runner
      - uses: actions/upload-artifact@v4
        with:
          name: wukong-runner-windows
          path: artifacts/runner/
