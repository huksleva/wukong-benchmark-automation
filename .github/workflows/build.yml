name: Build and checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows application
        run: dotnet build src/Wukong.Automation/Wukong.Automation.csproj -c Release
      - name: Run automated checks
        run: dotnet run --project tests/Wukong.Tests -c Release
      - name: Build and smoke-test standalone Windows EXE
        shell: pwsh
        run: ./packaging/Publish-Windows.ps1
      - name: Upload standalone EXE and checksums
        uses: actions/upload-artifact@v4
        with:
          name: wukong-windows-exe
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14
