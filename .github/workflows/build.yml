name: Build and checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows application
        run: dotnet build src/Wukong.Automation/Wukong.Automation.csproj -c Release
      - name: Run automated checks
        run: dotnet run --project tests/Wukong.Tests -c Release
      - name: Check portable menu state machine
        run: dotnet run --project tests/Wukong.Engine.Tests -c Release
      - name: Build and smoke-test standalone Windows EXE
        shell: pwsh
        run: ./packaging/Publish-Windows.ps1
      - name: Upload standalone EXE and checksums
        uses: actions/upload-artifact@v4
        with:
          name: wukong-windows-exe
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14
  reports:
    name: Reports / ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: macos-15-intel
            rid: osx-x64
          - runner: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check portable menu state machine
        run: dotnet run --project tests/Wukong.Engine.Tests -c Release
      - name: Build and verify native report reader
        run: python3 packaging/publish-reports.py --rid ${{ matrix.rid }}
      - name: Upload native package and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: wukong-reports-${{ matrix.rid }}
          path: |
            artifacts/reports/${{ matrix.rid }}/*.tar.gz
            artifacts/reports/${{ matrix.rid }}/*.sha256
          if-no-files-found: error
          retention-days: 14
  containers:
    name: Docker / ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate Compose and build report container
        run: |
          docker compose config --quiet
          docker compose up --build --exit-code-from reports
      - name: Verify CLI, real report fixtures and container isolation
        run: python3 tests/docker/check_container.py
