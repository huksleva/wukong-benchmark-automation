name: Ошибка
description: Воспроизводимая ошибка запуска, настроек, OCR или отчёта
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Не публикуйте токены, личные пути и резервные INI. Уязвимости отправляйте приватно через Security.
  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: Версии Windows/.NET, Steam build Benchmark Tool, коммит проекта и язык меню.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Как воспроизвести
      description: Команда, шаги, ожидаемый и фактический результат.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Диагностика
      description: Очищенный фрагмент runner.log или отдельный диагностический кадр; не вся папка results.
