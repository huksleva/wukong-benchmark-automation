name: Предложение
description: Улучшение автоматизации или документации
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Задача
      description: Какой сценарий сейчас неудобен и кому поможет изменение?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое поведение
      description: Конкретный пример желаемого результата.
    validations:
      required: true
